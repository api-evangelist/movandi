aid: movandi
name: Movandi
description: 'Movandi is an RF semiconductor company founded by former Broadcom executives
  (CEO Maryam Rofougaran and CTO Reza Rofougaran) that designs 5G mmWave chipsets, RF front
  ends, phased-array antenna modules, 5G smart repeaters, and beamforming software for
  terrestrial and non-terrestrial networks. Based in Irvine, California and backed by
  Sierra Ventures, the company holds 130+ patents covering millimeter wave semiconductor,
  system, and software technologies spanning 5G, fixed wireless, and satellite connectivity.
  Movandi is a hardware/semiconductor vendor and does not currently publish a public
  developer API, SDK, or developer portal surface.'
